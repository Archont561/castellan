# default: every-day command API (bun-led gates; cargo against the ambient
# toolchain or — via scripts/cargo-env.sh — delegated into shells).
# shells: rust toolchain + the conda-forge gtk/webkit stack and NO JavaScript
# runtime. The split is not cosmetic: conda-forge's bun builds all link
# icu 75 while every brotli-compatible webkit2gtk4.1 build demands icu 78,
# so one environment cannot hold both (decision-13).
[environments]
default = [
    "rust",
    "web",
    "utils",
]
shells = [
    "rust",
    "utils",
    "gtk-shells",
]

[feature.rust.dependencies]
cargo-deny = "0.20.*"
cargo-llvm-cov = "0.9.*"
cargo-nextest = "0.9.*"
rust = "==1.98.1"
rust-std-wasm32-unknown-unknown = "==1.98.1"
# Exact, and it must equal the `wasm-bindgen` version Cargo.lock resolves:
# wasm-pack uses a `wasm-bindgen` already on PATH only when the versions match
# exactly, and otherwise downloads one (or falls back to `cargo install`) mid
# build — an unpinned network install inside a gate. Bump this with the crate.
wasm-bindgen-cli = "==0.2.129"
wasm-pack = "0.15.*"

# Rust commands ride the feature, not the default environment: every
# environment that carries the toolchain exposes them — `pixi run cargo`
# in default, `pixi run -e shells cargo` where the gtk stack is present.
[feature.rust.tasks]
cargo = "cargo"
fmt-rust-check = "cargo fmt --all --check"

[feature.rust.tasks.xtask]
cmd = "cargo run -q -p castellan-xtask -- {{ subcommand }} {{ rest }}"

[[feature.rust.tasks.xtask.args]]
arg = "subcommand"

[[feature.rust.tasks.xtask.args]]
arg = "rest"
default = ""

[feature.utils.dependencies]
actionlint = "1.7.*"
convco = "0.7.*"

# Tauri's Linux native stack, from conda-forge instead of apt — so
# `cargo check/clippy/test --workspace --all-targets` compiles
# castellan-desktop/mobile (wry → gtk3 + webkit2gtk-4.1) with no system
# packages, including in this repo's offline airlocks. It lives in the
# `shells` environment because it can never share one with bun
# (decision-13); rust lanes reach it through scripts/cargo-env.sh.
# JavaScriptCoreGTK ships inside the webkit2gtk4.1 package
# (same upstream tarball);
# glib/cairo/pango/atk/gdk-pixbuf/libsoup arrive transitively through
# gtk3 + webkit2gtk4.1, X11 needs nothing (tao's x11-dl is a runtime
# dlopen), and conda's pkg-config activation exports PKG_CONFIG_PATH for
# the -sys build scripts. The conda rust toolchain's own cc wrapper links
# against this stack correctly — the CI re-export to the system cc exists
# only because CI's gtk currently comes from apt.
# NOTE: webkit2gtk4.1 was migrated to conda-forge from cf-post-staging;
# the pin window keeps to the staged 2.48 line.
[feature.gtk-shells.target.linux-64.dependencies]
pkg-config = ">=0.29"
gtk3 = ">=3.24,<3.25"
"webkit2gtk4.1" = ">=2.48,<2.50"
dbus = ">=1.15"
librsvg = ">=2.58"
# gio-2.0.pc carries `Requires.private: zlib`, and the gtk stack only ever
# pulls libzlib transitively — the runtime .so, with no zlib.pc and no
# zlib.h. pkg-config resolves the whole Requires.private chain even for a
# dynamic link, so gio-sys's build script fails with "Package 'zlib',
# required by 'gio-2.0', not found" and every --workspace cargo lane
# compiled against this env dies with it (task-49). The `zlib` conda-forge
# package is the dev side (headers + .pc); libzlib stays its runtime peer.
zlib = ">=1.3,<2"
# Same shape one layer down: fontconfig.pc carries `Requires.private:
# expat`, and the gtk stack pulls libexpat (runtime .so) transitively with
# no expat.pc and no expat.h. cairo, pango and gdk-3.0 all resolve
# fontconfig, so this one gap breaks every remaining -sys build script in
# the env — the gtk/webkit chain cannot compile past gio-sys without it.
expat = ">=2.6,<3"

# Export the search path explicitly instead of trusting pkg-config's
# baked-in default: conda-forge bakes the *install-time* prefix into the
# binary, and pixi-sandbox's restore materializes the env in a staging
# directory before moving it into place — so on every restored airlock
# the baked path points at a directory that no longer exists and the
# -sys build scripts report "glib-2.0 was not found". $CONDA_PREFIX is
# resolved at activation, so this is correct in both worlds (fresh
# `pixi install` and a restored transport) and redundant-at-worst.
[feature.gtk-shells.target.linux-64.activation.env]
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/share/pkgconfig"

[feature.web.dependencies]
bun = "==1.3.11"

# Pixi is the repository's command API. Keep implementation detail in the bun
# scripts and Cargo workspace, but enter both through `pixi run` so hooks, CI,
# agents, and contributors always resolve the locked environment first.
[tasks]
bun = "bun"
bunx = "bunx"
convco = "convco"
install = "bun install"
install-frozen = "bun install --frozen-lockfile"
gates = "bun run gates"
codegen = "bun run codegen"
codegen-check = "bun run codegen:check"
wasm = "bun run wasm"
lint = "bun run lint"
lint-workflows = "bun run lint:workflows"
lint-commits = "bun run lint:commits"
typecheck = "bun run typecheck"
test = "bun run test"
e2e = "bun run e2e"
storybook-build = "bun run build:storybook"
docs-build = "bun run docs:build"
advisories = "bun run advisories"
playwright-install-deps = "bunx playwright install-deps chromium"
hooks-install = "bun x lefthook install"
backlog = "bun run backlog"
dev-desktop = "bun run dev:desktop"
dev-mobile = "bun run dev:mobile"
dev-extension = "bun run dev:ext"
dev-docs = "bun run dev:docs"
dev-storybook = "bun run dev:storybook"

# The workspace table is where the platforms live, and the two linux entries
# below carry the solve-time virtuals, declared rather than host-detected.
[workspace]
channels = [
    "conda-forge",
]
description = "Local-first secrets manager: KeePass-compatible vault, authenticator and soft security key"
name = "castellan"
platforms = [
    # Declared instead of host-detected: the lock must resolve identically on
    # a CI runner (glibc 2.39), an airlock (as old as 2.36), and any laptop —
    # and it must never resolve a package that needs a newer glibc than the
    # oldest airlock it will be restored into. 2.34 is webkit2gtk4.1's own
    # floor, so the gtk-shells feature lands exactly at it.
    { platform = "linux-64", glibc = "2.34" },
    { platform = "linux-aarch64", glibc = "2.34" },
    # macOS gets bare entries: a glibc constraint is meaningless there, and a
    # bare string solves the subdir against pixi's default virtual packages.
    "osx-64",
    "osx-arm64",
]
version = "0.1.0"

[dependencies]
nodejs = ">=25.2.1,<26.11"
