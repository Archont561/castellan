[environments]
default = [
    "rust",
    "web",
    "utils",
    "gtk-shells",
]

[feature.rust.dependencies]
cargo-deny = "0.20.*"
cargo-llvm-cov = "0.9.*"
cargo-nextest = "0.9.*"
rust = "==1.98.1"
rust-std-wasm32-unknown-unknown = "==1.98.1"
# Exact, and it must equal the `wasm-bindgen` version Cargo.lock resolves:
# wasm-pack uses a `wasm-bindgen` already on PATH only when the versions match
# exactly, and otherwise downloads one (or falls back to `cargo install`) mid
# build — an unpinned network install inside a gate. Bump this with the crate.
wasm-bindgen-cli = "==0.2.129"
wasm-pack = "0.15.*"

[feature.utils.dependencies]
actionlint = "1.7.*"
convco = "0.7.*"

# Tauri's Linux native stack, from conda-forge instead of apt — so
# `cargo check/clippy/test --workspace --all-targets` compiles
# castellan-desktop/mobile (wry → gtk3 + webkit2gtk-4.1) in any pixi
# environment, including this repo's offline airlocks. JavaScriptCoreGTK
# ships inside the webkit2gtk4.1 package (same upstream tarball);
# glib/cairo/pango/atk/gdk-pixbuf/libsoup arrive transitively through
# gtk3 + webkit2gtk4.1, X11 needs nothing (tao's x11-dl is a runtime
# dlopen), and conda's pkg-config activation exports PKG_CONFIG_PATH for
# the -sys build scripts. The conda rust toolchain's own cc wrapper links
# against this stack correctly — the CI re-export to the system cc exists
# only because CI's gtk currently comes from apt.
# NOTE: webkit2gtk4.1 was migrated to conda-forge from cf-post-staging;
# the pin window keeps to the staged 2.48 line.
[feature.gtk-shells.target.linux-64.dependencies]
pkg-config = ">=0.29"
gtk3 = ">=3.24,<3.25"
"webkit2gtk4.1" = ">=2.48,<2.50"
dbus = ">=1.15"
librsvg = ">=2.58"

# bun floats within 1.3.* so the solver can pick the icu/brotli line the
# feature below commits linux-64 to — with an exact bun pin (and therefore
# an exact icu/brotli), nothing to float, and webkit2gtk4.1 goes
# unsatisfiable in the same environment.
[feature.web.dependencies]
bun = "1.3.*"

# icu 78 + brotli 1.2 are the only lines that close this environment:
# nodejs (every 25.2.1+ build) and bun demand libbrotlicommon 1.2.x, and
# the brotli-1.2-era woff2 build (h6fa0586_4) is precisely what
# webkit2gtk4.1's newer alma9 rebuilds (build _2 and up) link against —
# those also sit on icu 78.3. The icu pin keeps bun/nodejs on their
# icu-78-linked builds; the brotli pin keeps woff2/webkit on theirs.
# Linux-64 only: webkit2gtk4.1 exists for no other platform.
[feature.web.target.linux-64.dependencies]
libbrotlicommon = "1.2.*"
icu = "78.*"

# Pixi is the repository's command API. Keep implementation detail in the bun
# scripts and Cargo workspace, but enter both through `pixi run` so hooks, CI,
# agents, and contributors always resolve the locked environment first.
[tasks]
bun = "bun"
bunx = "bunx"
cargo = "cargo"
convco = "convco"
install = "bun install"
install-frozen = "bun install --frozen-lockfile"
gates = "bun run gates"
codegen = "bun run codegen"
codegen-check = "bun run codegen:check"
wasm = "bun run wasm"
lint = "bun run lint"
lint-workspace = "bun run all:lint"
lint-workflows = "bun run lint:workflows"
lint-commits = "bun run lint:commits"
typecheck = "bun run all:typecheck"
test = "bun run all:test"
e2e = "bun run all:e2e"
storybook-build = "bun run all:storybook"
docs-build = "bun run docs:build"
advisories = "bun run all:advisories"
fmt-rust-check = "cargo fmt --all --check"
playwright-install-deps = "bunx playwright install-deps chromium"
hooks-install = "bun x lefthook install"
backlog = "bun run backlog"
dev-desktop = "bun run dev:desktop"
dev-mobile = "bun run dev:mobile"
dev-extension = "bun run dev:ext"
dev-docs = "bun run dev:docs"
dev-storybook = "bun run dev:storybook"

[tasks.xtask]
cmd = "cargo run -q -p castellan-xtask -- {{ subcommand }} {{ rest }}"

[[tasks.xtask.args]]
arg = "subcommand"

[[tasks.xtask.args]]
arg = "rest"
default = ""

# Solve-time virtuals, declared instead of host-detected: the lock must
# resolve identically on a CI runner (glibc 2.39), an airlock (as old as
# 2.36), and any laptop — and it must never resolve a package that needs a
# newer glibc than the oldest airlock it will be restored into. 2.34 is
# webkit2gtk4.1's own floor, so the gtk-shells feature lands exactly at it.
[system-requirements]
libc = { family = "glibc", version = "2.34" }

[workspace]
channels = [
    "conda-forge",
]
description = "Local-first secrets manager: KeePass-compatible vault, authenticator and soft security key"
name = "castellan"
platforms = [
    "linux-64",
    "linux-aarch64",
    "osx-64",
    "osx-arm64",
]
version = "0.1.0"

[dependencies]
nodejs = ">=25.2.1,<26.11"
