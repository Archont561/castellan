# The transport-independent application dispatcher. Desktop, mobile, native
# messaging and the future CLI all terminate here; adapters only move the
# shared protocol envelope across their platform boundary.
[package]
name = "castellan-dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The shared Castellan RPC dispatcher"
publish = false

[lints]
workspace = true

[dependencies]
# The TOTP computation and import parsing behind get_totp /
# preview_otp_import — the dispatcher is where the vault's seed text and
# the otp crate's arithmetic meet (the two stay independent of each other).
castellan-otp = { workspace = true }
castellan-protocol = { workspace = true }
castellan-vault = { workspace = true }

[dev-dependencies]
# The suite builds a tiny real vault through keepass's builder so the
# dispatcher's tests exercise the session the way the apps do: unlock
# through the vault crate's front door, dispatch against it.
keepass = { workspace = true, features = ["save_kdbx4"] }
# The suite's matrices and properties ride the workspace's pinned pair, the
# same as ipc/otp/protocol/vault (AGENTS.md, "Tests live in a tests/
# directory"): #[case] rows per contract operation, proptest for the
# for-any-id and for-any-passphrase-request invariants.
proptest = { workspace = true }
rstest = { workspace = true }
