[package]
name = "castellan-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The KDBX vault core: unlock, entry projection, passphrase generation"
publish = false

[lints]
workspace = true

[dependencies]
argon2 = { workspace = true }
castellan-protocol = { workspace = true }
getrandom = { workspace = true }
# save_kdbx4 is a *production* feature now, not a test-only one: the
# copy-aside save path (decision-3) is this crate's public API. The
# discipline the old "never in [dependencies]" comment guarded for is
# enforced structurally instead — Database::save is not re-exported, and
# the only public save is VaultHandle::save, which cannot skip the
# copy-aside.
keepass = { workspace = true, features = ["save_kdbx4"] }
secrecy = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }
# The fixture factory constructs KdfConfig's Argon2d/Argon2id variants,
# whose `version` field is keepass's argon2 — rust-argon2, renamed here
# because its lib name collides with the workspace's RustCrypto argon2.
rust_argon2 = { workspace = true }
