[package]
name = "castellan-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The WASM face of the shared logic: what the extension runs in-browser, the apps link natively"
publish = false

[lints]
workspace = true

[dependencies]
castellan-otp = { workspace = true }
castellan-protocol = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
ts-rs = { workspace = true }
wasm-bindgen = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# The suite mirrors the protocol crate's own shape (matrices + agreement
# property), so it rides the same pinned pair (AGENTS.md, "Tests live in
# a tests/ directory").
proptest = { workspace = true }
rstest = { workspace = true }

# wasm-pack otherwise downloads Binaryen during a release build. A network
# fetch inside CI is neither pinned by pixi.lock nor available in the offline
# development environment; Cargo's release profile still optimizes the small
# module. Re-enable wasm-opt only after Binaryen itself is a locked tool.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
