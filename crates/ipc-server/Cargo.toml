# The app-side half of the native channel (doc-2): the socket server that
# multiplexes browser connections, the association handshake in front of it,
# and the data the connected-browsers panel renders. A library crate, not an
# app-shell concern, so every rule here is testable without a webview — the
# desktop and mobile shells construct it, hand it a request handler and their
# session's event stream, and surface its panel snapshot in their UI.
[package]
name = "castellan-ipc-server"
description = "The app-side IPC server: connection multiplexing, the association handshake, and the connected-browsers panel data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
castellan-ipc = { workspace = true }
castellan-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Peer credentials (SO_PEERCRED / getpeereid) for the same-user check.
# See the workspace table's comment — std's peer_cred is unstable.
libc = { workspace = true }

[dev-dependencies]
# The suite drives a real server over a real Unix socket in a temp dir; the
# rstest matrices and the timing-sensitive cases ride the workspace pair.
rstest = { workspace = true }
# The proof roundtrip and the store's persistence rules are properties, not
# examples — fast-check's counterpart on the Rust side.
proptest = { workspace = true }
