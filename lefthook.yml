# Git hooks, installed by `pixi run hooks-install` (also run by
# `pixi run install` through the guarded prepare script).
#
# Pixi is deliberately the entry point for every hook command. Hooks must not
# inherit an arbitrary cargo/bun/convco from the caller's PATH and disagree
# with CI about which locked tool produced the verdict.

# Stage what the hooks just fixed, so the commit contains the formatting the
# hook applied and CI does not fail on bytes the hook never committed.
pre-commit:
  parallel: true
  commands:
    fix-js:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,svelte}"
      run: pixi run bun x biome check --write --no-errors-on-unmatched {staged_files} && pixi run git add {staged_files}
      stage_fixed: true
    format-rs:
      glob: "{crates,apps}/**/*.rs"
      run: pixi run cargo fmt --all && pixi run git add {staged_files}
      stage_fixed: true

# The whole working tree is what CI will build; lint it, don't scope it.
pre-push:
  parallel: true
  commands:
    lint:
      run: pixi run lint
    typecheck:
      run: pixi run typecheck

# Conventional commits only; convco is part of the locked pixi environment,
# so unlike the old PATH-sensitive hook there is no fallback implementation
# that can make a different decision on another machine.
commit-msg:
  commands:
    conventional:
      run: pixi run convco check --from-stdin --strip < {1}
