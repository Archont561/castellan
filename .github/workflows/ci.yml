name: ci

# One job, top to bottom: the gate reads as the checks, in order. Everything
# fans out through turbo (Rust via the @castellan/rust façade, TypeScript via
# bun) exactly as it does locally — every check enters through the same
# `pixi run <task>` API a contributor uses. (Single-job shape copied from
# geoquery's ci.yml.)
#
# Every tool the gates call comes from the committed pixi.lock (decision-8):
# bun, rust with clippy + rustfmt, the wasm32 std, wasm-pack, cargo-deny and
# actionlint. setup-pixi installs that environment `--locked`; each repository
# command below enters it explicitly through `pixi run`, the same API a
# contributor uses. No step can resolve a runner-global binary, and a toolchain
# bump is one reviewable diff on pixi.toml + pixi.lock instead of a pin here
# as well. rust-toolchain.toml still pins the rustup installs of contributors
# who skip pixi; conda's cargo is not a rustup proxy, so the two pins move
# together (AGENTS.md, "Toolchain").

on:
  push:
    branches: [main]
  pull_request:
  # relock.yml pushes its `chore(lock):` commit with GITHUB_TOKEN, which starts
  # no workflow, and then dispatches this one — that dispatch is the only
  # verdict a lock commit ever gets. Without this trigger the dispatch fails
  # ("workflow does not have workflow_dispatch trigger") and the refreshed
  # lockfile sits on the branch unverified.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The stock runner image ships a dozen-plus GB of toolchains this
      # repo never touches -- dotnet, the Android SDK, ghc, CodeQL -- and
      # what stays free is not enough for the gates below: the Rust
      # workspace builds in debug, two Tauri shells included, on top of
      # the target/ restored by the cargo cache, and PR #6's Test step
      # died with `No space left on device` at the archive step of the
      # app libs. A contributor's machine is not quota'd like a runner,
      # so the reclaim lives here in CI, not in the gates.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      # Tauri's Linux builds need the webkit stack; without it
      # `cargo check --workspace` (which covers apps/*/src-tauri) cannot run.
      # apt, not conda: these are the system libraries the app links against
      # on a user's machine, and pixi manages dev *tools*, not the platform.
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # The whole dev-tool environment in one step. `locked: true` makes a
      # stale pixi.lock fail the gate instead of silently re-solving — drift
      # is relock.yml's lane, not something CI papers over — and `cache`
      # keys the restored environment on pixi.lock itself. Do not activate it:
      # explicit `pixi run` calls below enforce the command boundary.
      # environments: CI's own webkit/gtk still comes from apt, below, so this
      # workflow asks pixi for the default environment alone — installing the
      # `shells` env here would extract webkit2gtk4.1's whole tree into every
      # job for nothing. Airlock transports carry shells instead (decision-13).
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default

      # conda-forge's rust ships an activation script that points cargo at
      # conda's gcc (x86_64-conda-linux-gnu-cc), which links against conda's
      # sysroot. The Tauri crates link against the *system* webkit/gtk
      # installed above, built for the runner's glibc, and resolving those
      # shared objects through the older conda sysroot fails on symbol
      # versions. rustc and its std stay the locked conda ones; only the final
      # link goes back to the system cc. Exported for every subsequent
      # `pixi run` invocation.
      - name: Link with the system toolchain
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc" >> "$GITHUB_ENV"

      # Two caches here, one per thing that owns build output: cargo
      # (registry + target/) and turbo's task cache, keyed on the lockfiles
      # that decide when they are stale. The third — the dev-tool environment
      # — is setup-pixi's own, above.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install workspace dependencies
        run: pixi run install-frozen

      # Generate before typechecking, then fail if a contributor omitted any
      # committed output. Regeneration alone would hide stale files in a PR.
      - name: Check generated protocol and clients
        run: pixi run codegen-check

      - name: Build the WASM package
        run: pixi run wasm

      - name: Check generated WASM declarations
        run: pixi run git diff --exit-code -- packages/wasm/src/pkg/castellan_wasm.d.ts packages/wasm/src/pkg/castellan_wasm_bg.wasm.d.ts

      - name: Format check (rust)
        run: pixi run fmt-rust-check

      # The workflows are code too: the same `pixi run lint-workflows` a
      # contributor runs, on the actionlint the lockfile pins.
      - name: Lint workflows
        run: pixi run lint-workflows

      - name: Lint
        run: pixi run lint

      # The step above is the repo-wide biome pass (`biome check .`), which
      # the per-package `lint` tasks do not subsume -- they each check their
      # own `src`, and the docs app has no lint task at all. This step is the
      # other half, and the half CI has never run: `@castellan/rust`'s task
      # is where `cargo clippy -- -D warnings` and `cargo deny check bans
      # licenses sources` live.
      - name: Lint (workspace tasks)
        run: pixi run lint-workspace

      - name: Typecheck
        run: pixi run typecheck

      # The docs site is a workspace member but has no typecheck/test
      # tasks, so this is the step that proves it still builds. (Its
      # files are linted by the biome step above with everything else.)
      - name: Build the docs site
        run: pixi run docs-build

      # Test output is tee'd to a file so a failure can be *surfaced*, not
      # just failed: the next step turns cargo's failures section and bun's
      # (fail) lines into `::error` annotations. "Which test failed" should
      # never require log access — reviewers reading the PR check and
      # sandboxes that cannot reach the Actions log hosts both get the
      # answer inline.
      - name: Test
        run: |
          set -o pipefail
          pixi run test 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Surface test failures as annotations
        if: failure()
        run: |
          awk '
            /^     Running/ { bin = $2 }
            /^---- .* stdout ----$/ { name = $2 }
            name && /panicked at/ {
              printf "::error title=%s %s::%s\n", bin, name, $0
              name = ""
            }
            /\(fail\)/ {
              printf "::error title=bun test::%s\n", $0
            }
          ' "$RUNNER_TEMP/test-output.log" > "$RUNNER_TEMP/annotations"

          # Zero annotations means no test failed -- the build itself did,
          # and cargo reports that in plain `error:` lines (PR #6: exit
          # 101, nothing matched above, the cause `No space left on
          # device` mid-archive). This digest is the one AGENTS.md's
          # "Reading a failed CI run" says to read before fetching the log.
          [ -s "$RUNNER_TEMP/annotations" ] || awk '
            /^error/ {
              printf "::error title=cargo::%s\n", $0
            }
            /warning: build failed/ {
              printf "::error title=cargo::%s\n", $0
            }
          ' "$RUNNER_TEMP/test-output.log" > "$RUNNER_TEMP/annotations"

          head -10 "$RUNNER_TEMP/annotations" || true

      # Browser system libraries for the prebundled chromium (the browser
      # binary itself arrives with `bun install` via the root
      # @playwright/browser-chromium devDependency — no manual step).
      - name: Install Playwright system dependencies
        run: pixi run playwright-install-deps

      # E2E drives the real faces: the two SvelteKit apps through their
      # dev servers, and the built extension loaded into full Chromium.
      # The ui package's component tests already ran in the Test step.
      - name: E2E
        run: pixi run e2e

      - name: Build Storybook
        run: pixi run storybook-build

      - name: Advisories
        run: pixi run advisories
