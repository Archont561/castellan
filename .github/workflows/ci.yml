name: ci

# One job, top to bottom: the gate reads as the checks, in order. Everything
# fans out through turbo (Rust via the @castellan/rust façade, TypeScript via
# bun) exactly as it does locally — `bun run gates` here is `bun run gates`
# on a contributor machine. (Single-job shape copied from geoquery's ci.yml;
# the pixi steps are replaced by rust-toolchain.toml + bun, which is how this
# repo pins its toolchain.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain from rust-toolchain.toml (pinned, so a contributor's
      # rustup cannot decide what passes here).
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      # Tauri's Linux builds need the webkit stack; without it
      # `cargo check --workspace` (which covers apps/*/src-tauri) cannot run.
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # The advisories gate needs the binary; cargo-deny is a standalone
      # release, not a rustup component, so CI installs it like wasm-pack.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The workflow linter — a Go release binary, so neither rustup nor bun
      # provides it; the project's own download script is the documented
      # install. (Local: `bun run lint:workflows`, see AGENTS.md.)
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Three caches, one per thing that owns build output: cargo (registry +
      # target/), and turbo's task cache. Keyed on the lockfiles that decide
      # when they are stale.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # Codegen before typechecking: the TS protocol package typechecks the
      # generated directory, so it has to exist first.
      - name: Generate protocol bindings
        run: bun run codegen

      - name: Build the WASM package
        run: bun run wasm

      - name: Format check (rust)
        run: cargo fmt --all --check

      # The workflows are code too: the same `bun run lint:workflows` a
      # contributor runs, on the binaries the step above installed.
      - name: Lint workflows
        run: bun run lint:workflows

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run all:typecheck

      # The docs site is a workspace member but has no typecheck/test
      # tasks, so this is the step that proves it still builds. (Its
      # files are linted by the biome step above with everything else.)
      - name: Build the docs site
        run: bun run docs:build

      - name: Test
        run: bun run all:test

      # Browser system libraries for the prebundled chromium (the browser
      # binary itself arrives with `bun install` via the root
      # @playwright/browser-chromium devDependency — no manual step).
      - name: Install Playwright system dependencies
        run: bunx playwright install-deps chromium

      # E2E drives the real faces: the two SvelteKit apps through their
      # dev servers, and the built extension loaded into full Chromium.
      # The ui package's component tests already ran in the Test step.
      - name: E2E
        run: bun run all:e2e

      - name: Build Storybook
        run: bun run all:storybook

      - name: Advisories
        run: bun run all:advisories
