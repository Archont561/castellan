name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit supersedes all work for the same PR/branch. In particular this
# prevents a browser/native lane for an obsolete commit consuming a runner.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default
      - run: pixi run lint-workflows

  static-checks:
    name: biome and manifest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default
      # This is intentionally before native builds and browser system setup.
      - uses: ./.github/actions/install-workspace
      - run: pixi run bunx biome check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `turbo run typecheck` includes @castellan/rust, whose workspace-wide
      # Cargo check compiles the two Tauri shells and therefore needs GTK/WebKit.
      - uses: ./.github/actions/setup-native-build
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default
      - uses: ./.github/actions/install-workspace
      - run: pixi run typecheck

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default
      - run: pixi run fmt-rust-check

  generated-checks:
    name: generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default
      - uses: ./.github/actions/install-workspace
      - run: pixi run codegen-check
      - run: pixi run wasm
      - run: pixi run git diff --exit-code -- packages/wasm/src/pkg/castellan_wasm.d.ts packages/wasm/src/pkg/castellan_wasm_bg.wasm.d.ts

  build-and-test:
    name: build and test
    needs: [workflow-lint, static-checks, typecheck, rust-format, generated-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job starts only after typecheck. The identical Cargo key restores
      # the shell crates it compiled, then Cargo independently validates every
      # artifact fingerprint before test/build reuse.
      - uses: ./.github/actions/setup-native-build
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default
      - uses: ./.github/actions/install-workspace
      - run: pixi run lint
      - run: pixi run docs-build
      - name: Test
        run: |
          set -o pipefail
          pixi run test 2>&1 | tee "$RUNNER_TEMP/test-output.log"
      # Never replace a test failure with an awk/file-not-found failure.
      - name: Surface test failures as annotations
        if: ${{ failure() }}
        run: |
          if [[ ! -s "$RUNNER_TEMP/test-output.log" ]]; then
            echo 'Test output was not produced; see the failing step above.'
            exit 0
          fi
          awk '/^ *FAIL \[/ { print "::error title=nextest::" $0 } /\(fail\)/ { print "::error title=bun test::" $0 } /^error/ { print "::error title=cargo::" $0 }' "$RUNNER_TEMP/test-output.log" | head -10 || true

  e2e:
    name: browser E2E
    needs: [build-and-test]
    if: ${{ needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default
      - uses: ./.github/actions/install-workspace
      - run: pixi run playwright-install-deps
      - run: pixi run e2e

  storybook:
    name: Storybook
    needs: [static-checks, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default
      - uses: ./.github/actions/install-workspace
      - run: pixi run storybook-build

  advisories:
    name: advisories
    needs: [workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: false
          environments: default
      - uses: ./.github/actions/install-workspace
      - run: pixi run advisories
