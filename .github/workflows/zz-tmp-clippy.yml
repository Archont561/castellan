name: zz-tmp-clippy

# TEMPORARY diagnostic. Actions log download is blocked from the agent
# sandbox, so this surfaces the clippy output as a check annotation
# instead. Delete once the lints are fixed.

on:
  push:
    branches: [arena/01a0f9ca-castellan]

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
          activate-environment: true

      - name: Link with the system toolchain
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc" >> "$GITHUB_ENV"

      - name: Clippy, captured
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.txt 2>&1
          code=$?
          echo "exit=$code"
          {
            echo '## clippy exit '"$code"
            echo '```'
            cat /tmp/clippy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Only the warning/error headlines, as one annotation.
          grep -E '^(error|warning)(\[|:)' /tmp/clippy.txt | sort | uniq -c | sort -rn > /tmp/head.txt
          body=$(cat /tmp/head.txt)
          body="${body//'%'/'%25'}"
          body="${body//$'\n'/'%0A'}"
          body="${body//$'\r'/'%0D'}"
          echo "::error title=clippy headlines::${body}"
          # And the first 120 lines of real detail.
          det=$(head -c 60000 /tmp/clippy.txt)
          det="${det//'%'/'%25'}"
          det="${det//$'\n'/'%0A'}"
          det="${det//$'\r'/'%0D'}"
          echo "::error title=clippy detail::${det}"
