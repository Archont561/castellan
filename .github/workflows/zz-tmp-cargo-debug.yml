name: tmp cargo debug

# TEMPORARY, delete before merge. Actions log blobs are unreachable from the
# agent sandbox, so this reruns the failing gate and surfaces its output as an
# annotation and a job summary, both of which the API does return.

on:
  push:
    branches: [arena/01a0f9ca-castellan]

permissions:
  contents: read

jobs:
  cargocheck:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          activate-environment: true
      - run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run codegen
      - name: Report what cargo check says
        run: |
          set +e
          which pkg-config
          out=$(cargo check --workspace --all-targets 2>&1)
          code=$?
          {
            echo "### cargo check exited ${code}"
            echo "pkg-config: $(which pkg-config)"
            echo '```'
            echo "${out}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          escaped=$(printf 'pkgconfig=%s%s' "$(which pkg-config)" "$(printf '%s' "${out}" | grep -vE '^\s*(Compiling|Checking|Downloaded|Updating|Adding|Locking)' | tail -c 2500)" | sed ':a;N;$!ba;s/\n/%0A/g')
          printf '::error::%s\n' "${escaped}"
