name: tmp typecheck debug

# TEMPORARY, delete before merge. Actions log blobs are unreachable from the
# agent sandbox, so this reruns the failing gate and surfaces its output as an
# annotation and a job summary, both of which the API does return.

on:
  push:
    branches: [arena/01a0f9ca-castellan]

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          locked: true
          activate-environment: true
      - run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run codegen
      - run: bun run wasm
      - name: Report what typecheck says
        run: |
          set +e
          echo "--- generated pkg ---"
          ls -la packages/wasm/src/pkg
          out=$(bun run --cwd packages/wasm typecheck 2>&1)
          code=$?
          {
            echo "### packages/wasm typecheck exited ${code}"
            echo '```'
            ls packages/wasm/src/pkg
            echo "${out}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          escaped=$(printf 'pkg: %s%s' "$(ls packages/wasm/src/pkg | tr '\n' ' ')" "${out}" | tail -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')
          printf '::error::%s\n' "${escaped}"
